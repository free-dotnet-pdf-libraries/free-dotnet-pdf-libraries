name: Awesome Lint

# Validates README.md against the awesome-list standard on a weekly schedule
# (and on demand). Does not run on push/PR.
on:
  schedule:
    - cron: "30 6 * * 1" # every Monday 06:30 UTC
  workflow_dispatch: {}

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run awesome-lint
        run: npx awesome-lint
